#
# The lab realm `fluid`, imported once by the Keycloak operator. This is a
# second values file of the `keycloak` release; lab-objects merges its
# `objects` with components/keycloak/values.yaml.
#
# `clientScopes` are Keycloak's built-in scopes plus `lakekeeper` (an audience
# mapper), taken from Lakekeeper's examples/access-control-simple/keycloak/realm.json
# at v0.14.0 (Apache-2.0, https://github.com/lakekeeper/lakekeeper) with their
# ids removed. A realm import that lists clientScopes gets only those, so the
# built-ins must be listed too (`basic` carries the `sub` claim). That file's
# users and committed client secrets are NOT copied.
#
# Client secrets are ${...} placeholders that the operator fills from Secret
# keycloak/keycloak-realm-clients, written by `lab up` from OpenBao. The
# Iceberg REST clients request scope `lakekeeper` (Keycloak rejects unknown
# scopes), which puts `lakekeeper` in the token's audience.
objects:
  30-realm-import:
    apiVersion: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    metadata:
      name: fluid
    spec:
      keycloakCRName: keycloak
      placeholders:
        LAKEKEEPER_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: lakekeeper
        LAB_ADMIN_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: lab-admin
        TRINO_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: trino
        SPARK_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: spark
        LAB_PROBE_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: lab-probe
        FLUID_PIPELINE_CLIENT_SECRET:
          secret:
            name: keycloak-realm-clients
            key: fluid-pipeline
      realm:
        realm: fluid
        displayName: fluid-fabric-lab
        enabled: true
        sslRequired: external
        registrationAllowed: false
        bruteForceProtected: true
        accessTokenLifespan: 900
        defaultDefaultClientScopes:
          - role_list
          - profile
          - email
          - roles
          - web-origins
          - acr
          - basic
        defaultOptionalClientScopes:
          - offline_access
          - microprofile-jwt
          - lakekeeper
        clientScopes:
          - name: acr
            description: OpenID Connect scope for add acr (authentication context class reference) to the token
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: acr loa level
                protocol: openid-connect
                protocolMapper: oidc-acr-mapper
                consentRequired: false
                config:
                  id.token.claim: "true"
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
          - name: roles
            description: OpenID Connect scope for add user roles to the access token
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              consent.screen.text: ${rolesScopeConsentText}
              display.on.consent.screen: "true"
            protocolMappers:
              - name: realm roles
                protocol: openid-connect
                protocolMapper: oidc-usermodel-realm-role-mapper
                consentRequired: false
                config:
                  user.attribute: foo
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: realm_access.roles
                  jsonType.label: String
                  multivalued: "true"
              - name: client roles
                protocol: openid-connect
                protocolMapper: oidc-usermodel-client-role-mapper
                consentRequired: false
                config:
                  user.attribute: foo
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: resource_access.${client_id}.roles
                  jsonType.label: String
                  multivalued: "true"
              - name: audience resolve
                protocol: openid-connect
                protocolMapper: oidc-audience-resolve-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  access.token.claim: "true"
          - name: profile
            description: 'OpenID Connect built-in scope: profile'
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              consent.screen.text: ${profileScopeConsentText}
              display.on.consent.screen: "true"
            protocolMappers:
              - name: nickname
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: nickname
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: nickname
                  jsonType.label: String
              - name: username
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: username
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: preferred_username
                  jsonType.label: String
              - name: picture
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: picture
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: picture
                  jsonType.label: String
              - name: family name
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: lastName
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: family_name
                  jsonType.label: String
              - name: profile
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: profile
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: profile
                  jsonType.label: String
              - name: locale
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: locale
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: locale
                  jsonType.label: String
              - name: gender
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: gender
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: gender
                  jsonType.label: String
              - name: website
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: website
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: website
                  jsonType.label: String
              - name: full name
                protocol: openid-connect
                protocolMapper: oidc-full-name-mapper
                consentRequired: false
                config:
                  id.token.claim: "true"
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
              - name: birthdate
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: birthdate
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: birthdate
                  jsonType.label: String
              - name: zoneinfo
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: zoneinfo
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: zoneinfo
                  jsonType.label: String
              - name: middle name
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: middleName
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: middle_name
                  jsonType.label: String
              - name: updated at
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: updatedAt
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: updated_at
                  jsonType.label: long
              - name: given name
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: firstName
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: given_name
                  jsonType.label: String
          - name: role_list
            description: SAML role list
            protocol: saml
            attributes:
              consent.screen.text: ${samlRoleListScopeConsentText}
              display.on.consent.screen: "true"
            protocolMappers:
              - name: role list
                protocol: saml
                protocolMapper: saml-role-list-mapper
                consentRequired: false
                config:
                  single: "false"
                  attribute.nameformat: Basic
                  attribute.name: Role
          - name: lakekeeper
            description: Client of Lakekeeper
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              display.on.consent.screen: "true"
              gui.order: ""
              consent.screen.text: ""
            protocolMappers:
              - name: Add lakekeeper Audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  included.client.audience: lakekeeper
                  id.token.claim: "false"
                  lightweight.claim: "false"
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "false"
          # Audience of Trino's JWT authentication (required-audience=trino).
          # Same shape as the `lakekeeper` scope above; Keycloak documents the
          # audience mapper in "Server Administration Guide > Configuring
          # audience" (Audience mapper, `included.client.audience`).
          - name: trino
            description: Client of Trino (JWT audience)
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              display.on.consent.screen: "false"
              gui.order: ""
              consent.screen.text: ""
            protocolMappers:
              - name: Add trino Audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  included.client.audience: trino
                  id.token.claim: "false"
                  lightweight.claim: "false"
                  introspection.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "false"
          - name: email
            description: 'OpenID Connect built-in scope: email'
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              consent.screen.text: ${emailScopeConsentText}
              display.on.consent.screen: "true"
            protocolMappers:
              - name: email verified
                protocol: openid-connect
                protocolMapper: oidc-usermodel-property-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: emailVerified
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: email_verified
                  jsonType.label: boolean
              - name: email
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: email
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: email
                  jsonType.label: String
          - name: web-origins
            description: OpenID Connect scope for add allowed web origins to the access token
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              consent.screen.text: ""
              display.on.consent.screen: "false"
            protocolMappers:
              - name: allowed web origins
                protocol: openid-connect
                protocolMapper: oidc-allowed-origins-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  access.token.claim: "true"
          - name: offline_access
            description: 'OpenID Connect built-in scope: offline_access'
            protocol: openid-connect
            attributes:
              consent.screen.text: ${offlineAccessScopeConsentText}
              display.on.consent.screen: "true"
          - name: microprofile-jwt
            description: Microprofile - JWT built-in scope
            protocol: openid-connect
            attributes:
              include.in.token.scope: "true"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-usermodel-realm-role-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  multivalued: "true"
                  userinfo.token.claim: "true"
                  user.attribute: foo
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: groups
                  jsonType.label: String
              - name: upn
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  user.attribute: username
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: upn
                  jsonType.label: String
          - name: basic
            description: OpenID Connect scope for add all basic claims to the token
            protocol: openid-connect
            attributes:
              include.in.token.scope: "false"
              display.on.consent.screen: "false"
            protocolMappers:
              - name: sub
                protocol: openid-connect
                protocolMapper: oidc-sub-mapper
                consentRequired: false
                config:
                  introspection.token.claim: "true"
                  access.token.claim: "true"
              - name: auth_time
                protocol: openid-connect
                protocolMapper: oidc-usersessionmodel-note-mapper
                consentRequired: false
                config:
                  user.session.note: AUTH_TIME
                  introspection.token.claim: "true"
                  userinfo.token.claim: "true"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  claim.name: auth_time
                  jsonType.label: long
        clients:
          - clientId: lakekeeper
            name: lakekeeper
            description: Audience of the Lakekeeper catalog API (no flows)
            enabled: true
            protocol: openid-connect
            publicClient: false
            bearerOnly: false
            clientAuthenticatorType: client-secret
            secret: ${LAKEKEEPER_CLIENT_SECRET}
            serviceAccountsEnabled: false
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
          - clientId: lab-admin
            name: lab-admin
            description: 'lab up: Lakekeeper bootstrap and grants (the catalog''s server admin)'
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${LAB_ADMIN_CLIENT_SECRET}
            serviceAccountsEnabled: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
            defaultClientScopes:
              - basic
              - profile
              - email
              - roles
              - web-origins
              - acr
            optionalClientScopes:
              - lakekeeper
              - offline_access
            attributes:
              client_credentials.use_refresh_token: "false"
              use.refresh.tokens: "false"
          - clientId: trino
            name: trino
            description: Trino's Iceberg REST catalog connection (client credentials)
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${TRINO_CLIENT_SECRET}
            serviceAccountsEnabled: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
            defaultClientScopes:
              - basic
              - profile
              - email
              - roles
              - web-origins
              - acr
            optionalClientScopes:
              - lakekeeper
              - offline_access
            attributes:
              client_credentials.use_refresh_token: "false"
              use.refresh.tokens: "false"
          - clientId: spark
            name: spark
            description: Spark jobs against the Iceberg REST catalog (client credentials)
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${SPARK_CLIENT_SECRET}
            serviceAccountsEnabled: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
            defaultClientScopes:
              - basic
              - profile
              - email
              - roles
              - web-origins
              - acr
            optionalClientScopes:
              - lakekeeper
              - offline_access
            attributes:
              client_credentials.use_refresh_token: "false"
              use.refresh.tokens: "false"
          - clientId: lab-probe
            name: lab-probe
            description: 'lab check: a principal with no grants, which every catalog call must deny'
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${LAB_PROBE_CLIENT_SECRET}
            serviceAccountsEnabled: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
            defaultClientScopes:
              - basic
              - profile
              - email
              - roles
              - web-origins
              - acr
            optionalClientScopes:
              - lakekeeper
              - offline_access
            attributes:
              client_credentials.use_refresh_token: "false"
              use.refresh.tokens: "false"
          - clientId: fluid-pipeline
            name: fluid-pipeline
            description: 'A pipeline identity: dbt-trino through Trino (client credentials, scope trino)'
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${FLUID_PIPELINE_CLIENT_SECRET}
            serviceAccountsEnabled: true
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            implicitFlowEnabled: false
            defaultClientScopes:
              - basic
              - profile
              - roles
              - web-origins
              - acr
            optionalClientScopes:
              - trino
            attributes:
              client_credentials.use_refresh_token: "false"
              use.refresh.tokens: "false"
              access.token.lifespan: "3600"   # dbt holds one token for a whole run
