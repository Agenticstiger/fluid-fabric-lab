#
# The spark tier's properties file (ConfigMap key spark-defaults.conf): the
# lab's lines, appended to the base conf of the spark-iceberg image. That image is Apache Spark with nothing configured
# (/opt/spark/conf holds only templates), so this file is the whole conf.
# Catalog `fluid` is the sink catalog forge's job.json names; declared here
# whole, the runner uses it as declared: Lakekeeper's Iceberg REST catalog,
# OAuth2 client credentials from Keycloak (the `spark` client; its secret is
# appended at run time from a Secret), and storage credentials vended per
# table, so no S3 key is configured for tables.
#
# The S3A block is for `fluid apply --env local` (lab-spark-submit): forge
# uploads the runner and job.json to s3://lab-spark-artifacts and spark-submit
# and the runner read them back. `s3://` is mapped to S3A on SeaweedFS, for that
# one bucket only (fs.s3a.bucket.<name>.*), path-style, with the key of the
# pod's identity (no warehouse access) from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in the environment. Table data stays on S3FileIO with
# vended credentials.
#
# The last block is the image's classpath (platform/images/spark-iceberg):
# - spark.jars names the two Iceberg jars; forge's own spark.jars is the path
#   of another image's Iceberg jar, and the operator's file replaces it (forge's merge_conf).
# - spark.jars.packages is the Kafka connector at the image's Spark version.
#   forge adds the same coordinate at the version it was written against;
#   forge's value unions with this one, one coordinate per group:artifact,
#   and this file's wins. Ivy resolves it from the image's offline Maven
#   repository (/opt/lab/ivysettings.xml), with no network.
# - spark.jars.excludes keeps Ivy from adding the connector's dependencies,
#   which are already in /opt/spark/jars.
spark.submit.deployMode                                    client
spark.eventLog.enabled                                     false
spark.authenticate                                         false
spark.sql.extensions                                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.fluid                                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.fluid.type                               rest
spark.sql.catalog.fluid.uri                                https://lakekeeper.lab.test/catalog
spark.sql.catalog.fluid.warehouse                          sales-wh
spark.sql.catalog.fluid.oauth2-server-uri                  https://keycloak.lab.test/realms/fluid/protocol/openid-connect/token
spark.sql.catalog.fluid.scope                              lakekeeper
spark.sql.catalog.fluid.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.fluid.io-impl                            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.fluid.client.region                      us-east-1
spark.driver.memory                                        1536m
spark.ui.enabled                                           false
spark.redaction.regex                                      (?i)secret|password|token|access[.]?key|credential
spark.hadoop.fs.s3.impl                                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.bucket.lab-spark-artifacts.endpoint               https://s3.lab.test
spark.hadoop.fs.s3a.bucket.lab-spark-artifacts.endpoint.region        us-east-1
spark.hadoop.fs.s3a.bucket.lab-spark-artifacts.path.style.access      true
spark.hadoop.fs.s3a.bucket.lab-spark-artifacts.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.jars                                                 /opt/lab/jars/iceberg-spark-runtime-3.5_2.12-1.12.0.jar,/opt/lab/jars/iceberg-aws-bundle-1.12.0.jar
spark.jars.ivySettings                                     /opt/lab/ivysettings.xml
spark.jars.ivy                                             /tmp/ivy
spark.jars.packages                                        org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8
spark.jars.excludes                                        org.apache.spark:spark-token-provider-kafka-0-10_2.12,org.apache.kafka:kafka-clients,com.google.code.findbugs:jsr305,org.apache.commons:commons-pool2
