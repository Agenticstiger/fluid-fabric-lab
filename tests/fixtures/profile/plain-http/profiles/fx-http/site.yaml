# PLANTED: an http:// catalog endpoint (every endpoint is HTTPS). profile_schema must FAIL.
schemaVersion: 1
site: fx-http
jurisdiction: lab
tiers:
  default: core
  supported:
    core: {expectations: expected/core.yaml}
endpoints:
  icebergRest:
    catalogKind: rest
    uri: http://catalog.fx.test/catalog
    warehouses: {sales: sales-wh}
  trino: {host: trino.fx.test, port: 443, auth: {method: jwt}}
  oidc:
    issuer: https://idp.fx.test/realms/fx
    clientId: fx-client
    credential: {env: FLUID_OIDC_CLIENT_SECRET}
  connect:
    sales: {api: strimzi.io/v1, namespace: sales, strimzi: {crClusterLabel: sales-connect}}
  kubernetes: {inCluster: true}
  publish: {defaultTarget: null}
facts:
  catalog.auth: oauth2
  streaming.connector_api: strimzi.io/v1
  kubernetes.api: present
