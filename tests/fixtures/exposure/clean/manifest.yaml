#
# L0 selftest: the exposure gate must PASS (ClusterIP only, the Envoy Service
# on node port 30443, SeaweedFS routed to seaweedfs-s3:8333 only).
apiVersion: v1
kind: Service
metadata: {name: web, namespace: fixture}
spec:
  type: ClusterIP
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fixture}
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: main
          image: quay.io/example/tool:1.2.3
          ports: [{containerPort: 8080}]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: {name: lab, namespace: envoy-gateway-system}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: lab-gateway
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - {port: 443, nodePort: 30443}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
  labels: {app.kubernetes.io/component: s3}
spec:
  type: ClusterIP
  ports: [{port: 8333}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: s3, namespace: seaweedfs}
spec:
  rules:
    - backendRefs:
        - {name: seaweedfs-s3, port: 8333}
