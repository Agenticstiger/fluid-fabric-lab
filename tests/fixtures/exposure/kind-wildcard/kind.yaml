# PLANTED (a kind port mapping on every interface). L0 selftest: the
# exposure gate must FAIL (run with --kind-config).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
