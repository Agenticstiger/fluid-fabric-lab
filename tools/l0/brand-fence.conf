#
# Brand fence configuration (read by tools/l0/brand_fence.py).
#
# No third-party marks in repo,
# package, image, file or directory names; third-party names only
# nominatively, in the places listed here, with a reason. Anything else that
# names one of the [terms] fails L0.
#
# Allowing a name, narrowest first:
#   1. on the line itself:            ... brand-fence: allow
#   2. a block (README sections):     brand-fence: allow-begin ... brand-fence: allow-end
#      (each on its own comment line; an unterminated block fails)
#   3. a path below: `<glob> [term,term]  # reason`. With terms, only those
#      terms are allowed in matching files; without, any term is.
# Globs are relative to the repository root; `**` spans directories.

[terms]
# Matched case-insensitively, as a whole word (letters/digits on neither side).
stackable
stackabletech
okdp
ilum
redpanda
redpandadata
confluent
confluentinc
aquifer

[allow-paths]
NOTICE                                   # third-party notices the licences require
THIRD-PARTY.md                           # third-party inventory (nominative)
docs/pins.md                             # pin rationale names upstream projects (nominative)
docs/component-choices.md redpanda       # the broker comparison names a denied option and why (nominative)
profiles/stackable/**                    # the values-only overlay directory; REUSE-checked
# Planted L0 cases, narrowest that works: each directory is a case
# tools/l0/selftest runs (it fails on a fixture directory no case uses).
tests/fixtures/brand/**                  # the brand gate's own planted and allowlisted texts
tests/fixtures/denylist/ilum/** ilum                    # planted denied image
tests/fixtures/denylist/helmfile-ilum-repo/** ilum      # planted denied chart repository
tests/fixtures/denylist/redpanda/** redpanda,redpandadata  # planted denied image
tests/fixtures/licence/ilum-eula/** ilum               # planted vendor EULA
tests/fixtures/reuse/*/profiles/stackable/** stackable  # the overlay directory the REUSE rules cover
tests/fixtures/reuse/*/REUSE.toml stackable             # REUSE annotations for that directory
tools/l0/brand-fence.conf                # this file
tools/l0/reuse_lint.py stackable         # names the overlay directory profiles/stackable it checks
tools/l0/selftest/__main__.py stackable  # names the overlay directory in fixture expectations
PRODUCTION-READINESS.md aquifer          # adapted from AQUIFER's file; MIT attribution must stay
labctl/doctor.py aquifer                 # MIT attribution for the idea borrowed from AQUIFER
REUSE.toml aquifer                       # REUSE annotation of the NOTICE file names AQUIFER
LICENSES/MIT.txt aquifer                 # licence text carries the AQUIFER copyright line
platform/charts/*.prov                   # Helm provenance: signed upstream metadata + armoured signature
platform/charts/keycloak-operator/crds/**      # vendored upstream CRDs, unmodified
platform/charts/keycloak-operator/upstream/**  # vendored upstream manifests, unmodified
platform/charts/upstream-licenses/**     # vendored upstream licence texts, unmodified
platform/schemas/kubernetes/**           # vendored upstream schemas, unmodified
platform/schemas/crds/**                 # schemas generated mechanically from upstream CRDs
