version: 2
sources:
  - name: events_raw
    schema: events_raw
    tables:
      - name: events
  - name: events_curated
    schema: events_curated
    tables:
      - name: events_daily
models:
  - name: events_hourly
    description: Events and distinct users per hour from the raw table, with that day's total from the daily table.
    columns:
      - name: event_hour
        data_tests: [not_null, unique]
      - name: events
        data_tests: [not_null]
