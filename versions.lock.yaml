#
# versions.lock.yaml - the single source of truth for every chart, image, tool
# and schema the lab uses. Resolved 2026-10-14 from primary sources (Helm repo
# indexes, `helm pull`, `crane digest`, registry manifests and referrers, GitHub
# release assets, licence texts read at the pinned tag). docs/pins.md explains
# the choices; nothing here is decided by this file alone.
#
# Field guide
#   pin              spec           = the lab's reference combination of versions;
#                                     in use.
#                    chosen         = picked where the reference left it open
#                                     (Gateway API implementation, Kafka version, PG flavour).
#                    chart-default  = what an upstream chart would run if not overridden;
#                                     recorded so the mirror and the denylist can see it.
#                                     NOT run by the lab unless `use: used`.
#                    denied         = on the licence/supply-chain denylist ; must
#                                     never be rendered. Recorded with its digest only so
#                                     the gate can match it.
#   candidate        (section `candidates:`) newer patch releases recorded but NOT in
#                    use; they land only after a soak period and a green run.
#   use              used | optional (off by default) | default-unused | denied
#   file / sha256    chart cache entry under platform/charts/ and its sha256; `lab`
#                    and L0 verify it with platform/charts/SHA256SUMS before rendering.
#   app_version      the chart's own appVersion; `runs` is what the lab actually runs.
#                    A mismatch is a lint error unless `app_version_mismatch` gives the
#                    reason.
#   license          chart_file: the LICENSE file inside the chart archive, read as text.
#                    `absent` means the archive ships none; chart_spdx is then
#                    `unlicensed` and upstream_* records the source repository's
#                    LICENSE, read at the pinned commit and vendored under
#                    platform/charts/upstream-licenses/.
#   render_network   none = renders from the cache with no network (all chart
#                    dependencies are vendored inside the archive).
#   subcharts        vendored dependencies; enabled_by_lab false means the lab's values
#                    must keep them off (several are Bitnami and would render denied images).
#   digest           image index digest (multi-arch manifest list / OCI index) from
#                    `crane digest`; the cluster pulls `ref@digest` from the local mirror.
#   signature.mode   key | keyless | none, as observed in the registry on 2026-10-14:
#                    cosign-sig-tag = legacy `sha256-<digest>.sig` tag;
#                    sigstore-bundle-oci-referrer = cosign v3 bundle via the OCI 1.1
#                    referrers API. `identity`/`issuer` come from the Fulcio
#                    certificate inside the signature (keyless).
#   sbom.attached    true when an SBOM travels with the image (buildkit in-index SPDX
#                    attestation, cosign attestation or .sbom tag); a detached SBOM is
#                    noted but counts as false.
#   status words in notes: "unverified" means not tested in a running cluster yet.

