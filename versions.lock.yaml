# Offline kubeconform schemas (platform/schemas). `regenerate.sh verify` checks
# platform/schemas/SHA256SUMS with no network.
schemas:
  kubernetes:
    source: "https://github.com/yannh/kubernetes-json-schema"
    commit: 817113f21a2643311cbc3e992bb44ffe1c416c54
    commit_date: "2026-10-11"
    version: v1.36.4
    flavour: standalone-strict
    path: platform/schemas/kubernetes/v1.36.4-standalone-strict
    kinds: platform/schemas/kubernetes/kinds.txt
    license: {spdx: Apache-2.0, text: platform/schemas/kubernetes/LICENSE}
    missing_upstream: ["apiextensions.k8s.io/v1 CustomResourceDefinition"]
  crds:
    path: platform/schemas/crds
    layout: "{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
    generator: platform/schemas/tools/crd2jsonschema.py
    generator_derived_from: {repo: "https://github.com/yannh/kubeconform", path: scripts/openapi2jsonschema.py, ref: v0.8.0, license: Apache-2.0}
    inputs: "CRDs rendered offline from every chart with crd_render_args (cert-manager, trust-manager, gateway-helm, cloudnative-pg, strimzi-kafka-operator, keycloak-operator)"
  kubeconform_flags: >-
    -strict -kubernetes-version 1.36.4
    -schema-location 'platform/schemas/kubernetes/{{ .NormalizedKubernetesVersion }}-standalone{{ .StrictSuffix }}/{{ .ResourceKind }}{{ .KindSuffix }}.json'
    -schema-location 'platform/schemas/crds/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'

# What is not pinned, and why. Each is a hard stop for the stage that
# needs it, never a silent skip.
not_pinned:
  - {item: "quay.io/vakamo/lakekeeper-plus", reason: "denied by policy (licensed edition); not resolved on purpose"}
  - {item: "connect-iceberg and fluid-runner images", reason: "no published digest (the lab publishes no image): fluid-runner is built on the operator's machine by `lab build` and never pushed; connect-iceberg is not built; digest null above"}
  - {item: "OpenTelemetry Collector", reason: "optional add-on with no pinned version; pin it when the add-on is added"}
  - {item: "publish registrar (OpenMetadata or DataHub)", reason: "optional, heavy, no pinned version"}
  - {item: "Rook-Ceph (lab-ceph profile)", reason: "separate opt-in profile (Rook v1.20.8); outside this chart set"}
  - {item: "OpenTofu providers and dbt/DuckDB wheels", reason: "pinned in platform/images/fluid-runner (tofu/.terraform.lock.hcl; requirements.txt, every wheel by sha256), not here"}
