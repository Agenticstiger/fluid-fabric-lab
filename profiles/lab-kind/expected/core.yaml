#
# profiles/lab-kind/expected/core.yaml - expectations ledger, core tier (no streaming or orchestration add-on).
# Schema: profiles/schema/expectations.schema.json.
#
# `lab accept` passes only if every observed status equals this ledger in both
# directions: an unexpected `passed` fails like an unexpected `failed`.
# Changing a cell needs a commit naming the capability change behind it.
# While stagesRun is false nothing has run, so every cell is `pending` with
# reasonCode not_run; the schema rejects anything else. Once stages have run,
# set stagesRun to true and replace these cells with the real results.

